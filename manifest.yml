modules:
  jira:globalPage:
    - key: retailinmotion-customer-insights
      resource: main
      resolver:
        function: resolver
      title: Customer Insights
      # The Retail inMotion logo (static/app/public/icon.png) in the Jira sidebar.
      icon: resource:main;icon.png
  # Settings. Jira admins only; checked again on the server. Two entries for
  # one page: a useAsConfig page only appears behind "Configure" (now in
  # Administration > Connected apps), so a plain entry also lists it in the
  # Jira settings > Apps sidebar like other apps.
  jira:adminPage:
    - key: customer-insights-settings
      title: Customer Insights
      resource: settings
      resolver:
        function: resolver
      useAsConfig: true
    - key: customer-insights-settings-menu
      title: Customer Insights
      resource: settings
      resolver:
        function: resolver
      layout: blank
  # Published reports for portal customers. Own function (src/portal.js) so
  # customers can't reach the agent resolvers.
  jiraServiceManagement:portalUserMenuAction:
    - key: customer-insights-portal-report
      title: Service report
      resource: portal
      resolver:
        function: portal-resolver
      viewportSize: large
      unlicensedAccess:
        - customer
    # Weekly SD reports (src/weekly.js): published weeks for the viewer's
    # organisations, with an Excel download. Same portal function.
    - key: customer-insights-weekly-report
      title: Weekly SD report
      resource: weekly
      resolver:
        function: portal-resolver
      viewportSize: xlarge
      unlicensedAccess:
        - customer
  # Live portal reports (src/liveJobs.js): an hourly check queues the reports
  # that are due; the consumer refreshes one organisation per event.
  scheduledTrigger:
    - key: live-reports-hourly
      function: live-scheduler
      interval: hour
    # Live surge detection (src/surgeJobs.js); does nothing until switched on.
    - key: surge-check
      function: surge-detector
      interval: fiveMinute
  consumer:
    - key: live-report-consumer
      queue: live-report-refresh
      function: live-refresh
  function:
    - key: resolver
      handler: index.handler
    - key: portal-resolver
      handler: portal.handler
    - key: live-scheduler
      handler: liveJobs.scheduler
      timeoutSeconds: 120
    - key: live-refresh
      handler: liveJobs.consumer
      timeoutSeconds: 900
    - key: surge-detector
      handler: surgeJobs.scheduler
      timeoutSeconds: 120
  # Atlassian-hosted Claude for the opt-in AI summary (src/ai.js).
  llm:
    - key: insights-llm
      model:
        - claude
resources:
  - key: main
    path: static/app/build
  - key: portal
    path: static/portal/build
  - key: settings
    path: static/settings/build
  - key: weekly
    path: static/weekly/build
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/32a00002-2a77-4083-9ef0-2419107f6ef5
permissions:
  scopes:
    - read:jira-work
    # Spike alert tickets (src/alerts.js), only when an admin switches them on
    - write:jira-work
    - read:servicedesk-request
    # GET /rest/servicedeskapi/organization (organisation picker)
    - read:organization:jira-service-management
    # Published portal reports (src/storage.js)
    - storage:app
  content:
    styles:
      - unsafe-inline
  # Email reports (src/graph.js): Microsoft 365 sign-in and Graph sendMail only.
  external:
    fetch:
      backend:
        - address: https://login.microsoftonline.com
        - address: https://graph.microsoft.com

name: Forge logs

# Read-only: prints recent function logs for the Retail inMotion Forge app,
# which can't be read from a local Forge CLI (different account).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Forge environment
        required: true
        default: production
      since:
        description: How far back (e.g. 15m, 2h)
        required: true
        default: 30m

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Print logs
        shell: bash
        env:
          FORGE_ENVIRONMENT: ${{ inputs.environment }}
          SINCE: ${{ inputs.since }}
        run: |
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge install list
          forge logs --environment "$FORGE_ENVIRONMENT" --since "$SINCE" --limit 200 --verbose
